[package]
name = "embarch-study-designer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared no_std data types (and the tools to work with them) for EmbArch hardware-in-the-loop studies, spanning embarch-api, embarch-core, and embarch-dev-bench firmware."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Plain `rlib` for local dev/test and for embarch-core/embarch-api's Cargo
# dependency use. Producing the actual staticlib dev-bench firmware links
# (design.md §3 decision 7) needs a real cross-compilation target/panic
# handler that don't exist yet (§7) — that build adds `--crate-type staticlib`
# (or a `[lib] crate-type` override) once the toolchain is set up; requesting
# it unconditionally here breaks a plain host `cargo build`, which has no
# panic_handler to resolve for a final staticlib artifact.

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
heapless = { version = "0.8", features = ["serde"] }
postcard = { version = "1.1", default-features = false }
crc = "3.3"
# Only pulled in by the `gatt-extract` feature's std-only authoring-time tool
# (design.md §3 decision 33) — never linked by dev-bench firmware or by
# embarch-core/embarch-api's plain Cargo-dependency use.
regex = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
# Only pulled in by the `study-ui` feature (design.md §3 decisions 34/35,
# milestone-11.md) -- the custom-action registry's on-disk format, and never
# linked by dev-bench firmware or embarch-core/embarch-api's plain
# Cargo-dependency use, same posture as `gatt-extract`'s own dependencies.
toml = { version = "0.8", optional = true }

[dev-dependencies]
# Used by this crate's own round-trip tests to confirm every wire type also
# serializes/deserializes through the embarch-api/events.json JSON path
# (design.md §3 decision 3's format-agnostic stance), independent of the
# `gatt-extract` feature.
serde_json = "1"

[[bin]]
name = "extract-gatt-config"
path = "tools/extract_gatt_config.rs"
required-features = ["gatt-extract"]

[features]
default = []
# design.md §3 decision 46: back `Study.steps` with a heap `Vec<Step>` instead
# of `heapless::Vec<Step, MAX_STEPS_PER_STUDY>`. Off by default — dev-bench's
# no_std firmware build has no allocator, and decision 15's allocator-free
# stance is unchanged for it. Host consumers (embarch-core, embarch-api,
# embarch-ui) enable it: `Step`'s 512-byte payload variant makes the
# fixed-capacity form a ~38 KB inline value moved on the stack per `Study`,
# which is what actually crashed a debug embarch-api. No wire effect — both
# backings serialize as a plain sequence.
alloc = []
# Enables std, only so `core-validation` can use floating-point/statistics helpers
# from the standard library. embarch-api and dev-bench firmware never enable this.
# `std` implies `alloc`: a build with the standard library has a global
# allocator by definition, so there is no coherent "std but keep the 64-slot
# inline array" configuration to preserve (decision 46).
std = ["alloc"]
# Gates the SignalCheck evaluation logic (design.md §3 decision 19) behind an
# explicit feature only embarch-core's build turns on — embarch-api and dev-bench
# firmware link the crate without it, so they see/serialize every SignalCheck
# variant but never compile the code that evaluates one against real samples.
core-validation = ["std"]
# Exposes the extern "C" surface dev-bench firmware links against (design.md
# §3 decisions 7, 23). Off by default so embarch-core/embarch-api (plain
# Cargo dependents) don't carry unused #[no_mangle] symbols.
ffi = []
# The static GATT-config extraction tool (design.md §3 decision 33): the
# `GattConfigExtractor` trait, `ZephyrBleDefExtractor`, and the
# `extract-gatt-config` CLI binary. std-only (filesystem access) — off by
# default so dev-bench firmware and embarch-core/embarch-api's plain
# Cargo-dependency use never carry `regex`/`serde_json`/std.
gatt-extract = ["std", "dep:regex", "dep:serde_json"]
# The custom-action registry + merged-action-list logic (design.md §3
# decisions 34/35, milestone-11.md §3.1/§3.2). `std`-only (file I/O) -- off
# by default, same reasoning as `gatt-extract`. Originally also gated this
# crate's own `study-designer-ui` binary (milestone-11.md §3.3 onward);
# that binary is retired (2026-08-24, `embarch-ui/milestone-1.md` §4.9) in
# favor of `embarch-ui`'s Study Designer tab, which depends on this feature
# for the same registry/merge/study_builder logic but calls it in-process
# rather than through a binary of its own -- `axum`/`tokio` dropped from
# this feature since nothing under it needs a web server anymore.
study-ui = ["std", "dep:toml"]

# design.md §3 decision 23: this crate is the build root when cross-compiled as
# dev-bench firmware's FFI staticlib, so this profile setting is what actually
# takes effect for that build (a dependency crate's own [profile.*] is otherwise
# ignored by Cargo). panic=abort is also the correct default for a no_std target
# with no unwinding runtime to begin with (§3 decision 5).
[profile.release]
panic = "abort"
