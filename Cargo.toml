[package]
name = "embarch-study-designer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared no_std data types (and the tools to work with them) for EmbArch hardware-in-the-loop studies, spanning embarch-api, embarch-core, and the embarch-dev-bench firmware build."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Plain `rlib` for local dev/test and for embarch-core/embarch-api's Cargo
# dependency use. dev-bench firmware links no Rust: its build reads the wire
# schema version, the limits and the wire enum values out of this crate's
# source at configure time (decision 7; embarch-dev-bench decisions 20, 56).
# The FFI staticlib it used to link was retired on 2026-11-10.

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
heapless = { version = "0.8", features = ["serde"] }
postcard = { version = "1.1", default-features = false }
crc = "3.3"
# Only pulled in by the `gatt-extract` feature's std-only authoring-time tool
# (decision 33) — never linked by dev-bench firmware or by
# embarch-core/embarch-api's plain Cargo-dependency use.
regex = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
# Same `gatt-extract`-only posture: ripgrep's directory walker, used so the
# repo-wide GATT scan (decision 57) honors the firmware repo's
# own `.gitignore` rather than a skip list this crate would have to guess and
# maintain per project.
ignore = { version = "0.4", optional = true }
# Only pulled in by the `study-ui` feature (decisions 34/35) -- the
# custom-action registry's on-disk format, and never
# linked by dev-bench firmware or embarch-core/embarch-api's plain
# Cargo-dependency use, same posture as `gatt-extract`'s own dependencies.
toml = { version = "0.8", optional = true }

# Only pulled in by the `pdf-text` feature (decision 101): the PDF object
# model and content-stream parser for the text extractor, and NFKC. Never
# linked by dev-bench firmware or any consumer that does not turn the feature on.
lopdf = { version = "0.47", default-features = false, optional = true }
unicode-normalization = { version = "0.1", optional = true }
# Only pulled in by the `hil-image` feature (EMB-357): the SHA-256 of an
# image's load segments. Never linked by dev-bench firmware or any consumer
# that does not turn the feature on.
sha2 = { version = "0.11", default-features = false, optional = true }

[dev-dependencies]
# Used by this crate's own round-trip tests to confirm every wire type also
# serializes/deserializes through the embarch-api/events.json JSON path
# (decision 3's format-agnostic stance), independent of the
# `gatt-extract` feature.
serde_json = "1"

[[bin]]
name = "extract-gatt-config"
path = "tools/extract_gatt_config.rs"
required-features = ["gatt-extract"]

[features]
default = []
# decision 46: back `Study.steps` with a heap `Vec<Step>` instead
# of `heapless::Vec<Step, MAX_STEPS_PER_STUDY>`. Off by default — dev-bench's
# no_std firmware build has no allocator, and decision 15's allocator-free
# stance is unchanged for it. Host consumers (embarch-core, embarch-api,
# embarch-ui) enable it: `Step`'s 512-byte payload variant makes the
# fixed-capacity form a ~38 KB inline value moved on the stack per `Study`,
# which is what actually crashed a debug embarch-api. No wire effect — both
# backings serialize as a plain sequence.
# `serde/alloc` is not optional here even though it looks like a detail: with
# `default-features = false` serde has no `Deserialize` for `Vec`, `String` or
# `BTreeMap` at all, so `Backing<T, N>::deserialize` did not exist and
# `cargo build --features alloc` (and `--features std`) failed outright. Nobody
# noticed because every real consumer also depends on something that turns on
# `serde/std`, so feature unification supplied it -- the crate's own
# single-feature build was the only configuration that could see the gap, and
# it is exactly the configuration the feature matrix is supposed to check.
alloc = ["serde/alloc"]
# Enables std for the authoring-time tools (`gatt-extract`, `study-ui`).
# dev-bench firmware never enables this.
# `std` implies `alloc`: a build with the standard library has a global
# allocator by definition, so there is no coherent "std but keep the 64-slot
# inline array" configuration to preserve (decision 46).
std = ["alloc", "serde/std", "dep:regex"]
# The static GATT-config extraction tool (decision 33): the
# `GattConfigExtractor` trait, `ZephyrBleDefExtractor`, and the
# `extract-gatt-config` CLI binary. std-only (filesystem access) — off by
# default so dev-bench firmware and embarch-core/embarch-api's plain
# Cargo-dependency use never carry `regex`/`serde_json`/std.
gatt-extract = ["std", "dep:regex", "dep:serde_json", "dep:ignore"]
# The custom-action registry + merged-action-list logic (decisions
# 34/35). `std`-only (file I/O) -- off
# by default, same reasoning as `gatt-extract`. Originally also gated this
# crate's own `study-designer-ui` binary;
# that binary is retired (2026-08-24) in
# favor of `embarch-ui`'s Study Designer tab, which depends on this feature
# for the same registry/merge/study_builder logic but calls it in-process
# rather than through a binary of its own -- `axum`/`tokio` dropped from
# this feature since nothing under it needs a web server anymore.
study-ui = ["std", "dep:toml"]
# The `.eap` protocol-manifest parser and host-side reference interpreter
# (decisions 58-62). `std`-only authoring-time tooling, exactly
# like `gatt-extract`: an `.eap` file is read off the firmware repo's disk and
# resolved into a `Study` at build time, and nothing here runs on the DUT or
# on the dev-bench MCU. The wire types it produces (`crate::eap`) are `no_std`
# and are NOT behind this feature -- dev-bench carries those and executes
# them, and carries no parser at all.
eap-parse = ["std"]
# The built-in HIL reducers (decisions 92 to 94): count, rate, min, max, mean,
# percentile, interval, value-at-marker, with every behaviour version kept.
# Needs only `alloc` (`String`/`Vec` in its output; its square root is its own,
# so no `std` and no `libm`). embarch-core and embarch-api turn it on; nothing
# else does, so every existing consumer builds unchanged.
reducers = ["alloc"]
# The HIL verdict rules (decisions 95 to 98): the six verdicts, a step outcome's
# mapping, the guard band, the acceptance width and the requirement roll-up,
# each versioned by behaviour. Needs only `alloc`; embarch-core and embarch-api
# turn it on, nothing else does.
verdicts = ["alloc"]
# The PDF text extractor and the number grammar for `verify`'s check 4
# (decisions 101 to 103). `std` because the PDF reader is; off by default and
# nothing else turns it on, so no other feature set gains a dependency.
pdf-text = ["std", "dep:lopdf", "dep:unicode-normalization"]
# An image's load segments, identity and the bench-firmware list's shape
# (`interfaces/hil-image.md`). Host-only; needs `alloc` and `sha2`. Nothing
# turns it on yet, so every existing consumer builds unchanged.
hil-image = ["alloc", "dep:sha2"]

# The HIL test, suite manifest and plan types, their definition hash and the
# derived-test diff (`interfaces/hil-tests.md`, decision 109). Host-only; reuses
# the verdict rules' `Limit` and `DecisionRule`, and needs `sha2` and
# `serde_json` (the canonical JSON, RFC 8785). Nothing turns it on yet, so
# every existing consumer builds unchanged.
hil-test = ["verdicts", "dep:sha2", "dep:serde_json"]

[[example]]
name = "image_segments"
required-features = ["hil-image"]

# Decision 23 set this for the FFI staticlib, the one build this crate was the
# root of (a dependency crate's own [profile.*] is ignored by Cargo). The
# staticlib is retired; the setting stays because panic=abort is still the
# correct default for a no_std target with no unwinding runtime (decision 5),
# and today it reaches only this crate's own release binaries.
[profile.release]
panic = "abort"
