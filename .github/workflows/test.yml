name: Test

on:
  push:
  pull_request:

# Shape copied from embarch-topology/.github/workflows/test.yml: one Test job,
# dtolnay/rust-toolchain@stable with clippy, one named step per feature cell a
# real consumer actually uses, plus clippy on the widest set. No apt step —
# unlike embarch-topology this crate has no probe-rs/serialport, and every
# optional dependency (regex, serde_json, ignore, toml) is pure Rust.
#
# `--locked` is honest here: Cargo.lock is committed (this crate is the FFI
# build root for dev-bench firmware, decision 23), so a fresh runner resolves
# exactly what a developer does.
#
# WHY `cargo build` APPEARS AS ITS OWN STEP FOR THE TWO NARROW CELLS
# ------------------------------------------------------------------
# This crate's only dev-dependency is serde_json, which pulls serde with `std`.
# Edition 2021 means resolver v2, and resolver v2 unifies dev-dependency
# features into the library whenever it builds a target that needs dev-deps —
# which `cargo test` always does. Measured with `cargo tree -f "{p} {f}"`:
#
#   cell        serde_core features, -e normal   serde_core features, -e normal,dev
#   default     result                           result,std
#   std         alloc,result,std                 alloc,result,std
#
# So for the `default` and `alloc` cells `cargo test` compiles a *different*
# library than any consumer links, with `serde/std` silently switched on. That
# is the exact mechanism that hid the decision-46 `alloc` bug (`alloc` did not
# imply `serde/alloc`, so `Backing<T, N>: Deserialize` did not exist). This was
# verified rather than assumed: reintroducing the bug on a scratch copy,
# `cargo build --no-default-features --features alloc` fails with 16 errors and
# `cargo test --no-default-features --features alloc` passes 9/9. A matrix built
# only from `cargo test` steps would therefore have been unable to fail for the
# reason it was written.
#
# For `std` and the three std-only tool features the two columns are identical,
# so `cargo test` alone is the whole cell there and a `cargo build` twin would
# be duplicated work pretending to be coverage.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # --- Cell: default (no features). dev-bench firmware's real shape ---
      # no_std, no allocator (decisions 5, 15, 46). The one that must never
      # break. `default = []`, so this is identical to --no-default-features.
      - name: "build (default, no features) — dev-bench's no_std, allocator-free lib"
        run: cargo build --locked
      - name: "cargo test (default, no features)"
        run: cargo test --locked

      # --- Cell: alloc. The one that was broken and unseen (task 003) ---
      # `alloc` swaps Study.steps to a heap Vec (decision 46) and must carry
      # `serde/alloc` with it. The build step is the load-bearing one; see the
      # header — the test step cannot observe this cell's failure mode.
      - name: "build (alloc only) — the cell task 003 fixed; the ONLY step that can see serde/alloc go missing"
        run: cargo build --locked --no-default-features --features alloc
      - name: "cargo test (alloc only)"
        run: cargo test --locked --no-default-features --features alloc

      # --- Cell: std. What every host consumer gets ---
      # `std` implies `alloc`. embarch-core / embarch-api / embarch-ui land
      # here (or above it, via a tool feature).
      - name: "cargo test (std) — the host consumers' cell"
        run: cargo test --locked --no-default-features --features std

      # --- Cells: the three std-only tool features ---
      # Each is off by default and pulls its own dependencies, so each can rot
      # independently of the others and of `std`. Not combined: a combined step
      # would let one feature's compile error be reported as the others'.
      - name: "cargo test (gatt-extract) — regex/serde_json/ignore + the extract-gatt-config bin"
        run: cargo test --locked --no-default-features --features gatt-extract
      - name: "cargo test (study-ui) — toml + the custom-action registry/merge/study_builder"
        run: cargo test --locked --no-default-features --features study-ui
      - name: "cargo test (eap-parse) — the .eap parser and host-side reference interpreter"
        run: cargo test --locked --no-default-features --features eap-parse

      # --- Cell: ffi. Stated limit, deliberately ---
      # This step type-checks src/ffi.rs's extern "C" surface (decisions 7, 23)
      # against the rest of the crate on the host, in dev-bench's real no_std,
      # no-alloc configuration. It catches a signature or type break in that
      # module, which is a real regression class and the reason the step is here.
      #
      # It does NOT prove what dev-bench actually needs: that the crate links as
      # a `--crate-type staticlib` on a cross target with a panic handler and
      # panic=abort. That build root does not exist yet (see the comment above
      # [dependencies] in Cargo.toml, and §7). Adding a cross-compile step
      # before that toolchain exists would be a step that cannot fail for the
      # reason it was added, so this is a `build` with a stated ceiling instead.
      # `cargo test` is not used: this cell is narrow (no_std, no alloc) and
      # would be contaminated by dev-dependency feature unification exactly as
      # `default` and `alloc` are.
      - name: "build (ffi) — type-checks the extern \"C\" surface; does NOT prove the staticlib cross-link"
        run: cargo build --locked --no-default-features --features ffi

      # --- Clippy ---
      # Widest set first (every feature on at once, which is also the only
      # configuration asserting the tool features do not collide), then the
      # narrowest, because a no_std build's lints are not a subset of a std
      # build's.
      - name: "clippy (--all-features, the widest set)"
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: "clippy (default, no features — dev-bench's shape)"
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: "clippy (alloc only)"
        run: cargo clippy --locked --no-default-features --features alloc --all-targets -- -D warnings
