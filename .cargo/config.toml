# Why this file exists: `cargo test` cannot run this crate's own test suite at
# libtest's default 2 MiB per-test-thread stack. See `embarch-doc`'s
# `embarch-study-designer/decisions/limits.md` decision 63 for the full
# reasoning; the short version is:
#
#   * `cargo test` builds the crate with **default features**, which is the
#     allocator-free `no_std` shape dev-bench firmware links (decision 15).
#     In that shape `DevBenchMessage` is a [measured 2026-09-02] 75,288-byte
#     value, because `StudyStart.steps` is a 64-slot inline array of `Step`
#     and decision 46 deliberately keeps it that way on the build with no
#     allocator. Under `--features alloc` the same type is 2,128 bytes.
#   * A debug-profile test that builds a handful of those values overflows
#     2 MiB. [Measured 2026-09-02] on rustc 1.97.1: 2 MiB and 3 MiB abort,
#     4 MiB passes 107/107. The size is a *requirement* of the configuration
#     under test, not a defect to shrink — `bounded.rs`'s
#     `the_no_std_build_keeps_its_fixed_capacity_arrays` asserts it stays
#     inline, so "make the type smaller" is not available here.
#
# 64 MiB is the number `embarch-core`'s runtime already uses for the same class
# of value (decision 49), so there is one figure to remember rather than two,
# and it leaves 16x over the 4 MiB actually needed — deliberate, because the
# measured need moves with the debug profile and the compiler version, and the
# failure mode is a SIGABRT that takes the whole test binary down rather than a
# named failing test.
#
# Thread stacks are reserved, not committed, so this costs address space and
# not memory. It applies only to cargo invoked from inside this crate: config
# discovery walks up from the invocation directory, so `embarch-core` and
# `embarch-api` building this crate as a dependency are unaffected.
#
# Not `force = true`: an explicitly exported `RUST_MIN_STACK` still wins, which
# is how you reproduce the overflow (`RUST_MIN_STACK=2097152 cargo test`).
[env]
RUST_MIN_STACK = "67108864"
